<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multispecies ethnography</title>
    <script>
      // Applies the stored or system color scheme before the first paint, to avoid a flash of the wrong one.
      try {
        const preference = localStorage.getItem("colorSchemePreference");
        const prefersDark = matchMedia("(prefers-color-scheme: dark)").matches;
        if (preference === "dark" || (preference !== "light" && prefersDark)) {
          document.documentElement.classList.add("dark");
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
